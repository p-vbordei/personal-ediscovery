[project]
name = "personal-ediscovery"
version = "2026.5.24"
description = "Privacy-first local indexer for personal email, chats, photos, documents — with MCP server interface."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "Vlad Bordei", email = "bordeivlad@gmail.com" }
]
keywords = ["personal", "search", "mcp", "agent", "ai", "privacy", "ediscovery"]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.0.0",
  "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "numpy>=2.0"]
adapters = ["pypdf>=6.15.0", "python-docx>=1.0", "openpyxl>=3.1", "pillow>=10.0"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
ediscovery = "personal_ediscovery.cli:app"

[project.urls]
Homepage = "https://github.com/p-vbordei/research_capabilities"
Source = "https://github.com/p-vbordei/research_capabilities"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ediscovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
