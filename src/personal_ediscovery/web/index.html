<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal e-Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a1a;
      --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #121228 100%);
      --primary: hsl(220, 90%, 60%);
      --primary-hover: hsl(220, 90%, 65%);
      --secondary: hsl(280, 80%, 65%);
      --success: hsl(155, 75%, 45%);
      --danger: hsl(0, 75%, 55%);
      --text-main: #ffffff;
      --text-muted: #a0a0b8;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Noise texture */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.03;
      pointer-events: none;
      z-index: 100;
    }

    /* Glassmorphism utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 12px;
    }

    /* Sidebar */
    aside {
      width: 280px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid var(--glass-border);
      background: rgba(10, 10, 26, 0.5);
      backdrop-filter: blur(20px);
      z-index: 10;
    }

    aside h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .collections-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .collection-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .collection-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .collection-item.active {
      background: rgba(255, 255, 255, 0.1);
      border-left: 3px solid var(--primary);
    }

    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .collection-name { font-weight: 600; font-size: 0.95rem; }
    .badge {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: 600;
    }

    .collection-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }

    .btn-icon:hover {
      color: var(--primary);
      transform: scale(1.1) rotate(15deg);
    }

    /* Main Area */
    main {
      flex: 1;
      padding: 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-height: 100vh;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .search-container {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      font-size: 1.1rem;
      color: white;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(88, 130, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 4px 15px rgba(88, 130, 255, 0.3);
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(88, 130, 255, 0.4);
    }

    .btn-danger { background: var(--danger); }
    .btn-danger:hover { transform: scale(1.02); filter: brightness(1.1); }

    /* Results */
    .results-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.4s forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .result-title { font-weight: 600; font-size: 1.1rem; }
    
    .score-badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
    }

    .result-snippet {
      color: #e0e0e0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .highlight {
      background: rgba(88, 130, 255, 0.3);
      color: white;
      padding: 0 2px;
      border-radius: 2px;
    }

    .result-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal h2 { font-size: 1.2rem; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.9rem; color: var(--text-muted); }
    .form-input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus { border-color: var(--primary); }

    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }

    /* Loader */
    .loader {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <aside>
    <h1>Personal E-Discovery</h1>
    <div class="collections-list" id="col-list">
      <!-- Collections populated here -->
    </div>
    <button class="btn btn-primary" onclick="openNewCollectionModal()">+ New Collection</button>
  </aside>

  <main>
    <div class="top-bar">
      <div class="search-container">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search your digital life..." onkeypress="handleSearch(event)">
      </div>
      <button class="btn btn-danger" onclick="openForgetModal()" title="Forget documents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>

    <div class="results-container" id="results">
      <div style="text-align: center; color: var(--text-muted); margin-top: 40px;">
        Start typing to search across your collections.
      </div>
    </div>
  </main>

  <!-- Modals -->
  <div class="modal-overlay" id="newColModal">
    <div class="modal glass">
      <h2>Create Collection</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="newColName" class="form-input" placeholder="e.g., my_notes">
      </div>
      <div class="form-group">
        <label>Absolute Path (Root)</label>
        <input type="text" id="newColRoot" class="form-input" placeholder="e.g., /Users/me/Documents">
      </div>
      <div class="form-group">
        <label>Adapter</label>
        <select id="newColAdapter" class="form-input">
          <option value="fs-text">fs-text (Text, Markdown)</option>
          <option value="fs-doc">fs-doc (PDF, Word, Excel)</option>
          <option value="mail">mail (MBOX, EML)</option>
          <option value="signal-export">signal-export (JSON)</option>
          <option value="whatsapp-text">whatsapp-text (TXT)</option>
          <option value="photos-exif">photos-exif (Images)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn" style="background:transparent; border:1px solid var(--glass-border)" onclick="closeModals()">Cancel</button>
        <button class="btn btn-primary" onclick="createCollection()">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="forgetModal">
    <div class="modal glass">
      <h2>Forget Documents</h2>
      <p style="font-size:0.9rem; color:var(--text-muted)">Permanently delete documents matching a query.</p>
      <div class="form-group">
        <label>Collection</label>
        <select id="forgetColSelect" class="form-input"></select>
      </div>
      <div class="form-group">
        <label>Query</label>
        <input type="text" id="forgetQuery" class="form-input" placeholder="Text to match and delete">
      </div>
      <div class="modal-actions">
        <button class="btn" style="background:transparent; border:1px solid var(--glass-border)" onclick="closeModals()">Cancel</button>
        <button class="btn btn-danger" onclick="forgetDocuments()">Forget Data</button>
      </div>
    </div>
  </div>

  <script>
    let activeCollection = null;
    let collections = [];

    async function fetchCollections() {
      const res = await fetch('/api/collections');
      collections = await res.json();
      renderCollections();
    }

    function renderCollections() {
      const list = document.getElementById('col-list');
      list.innerHTML = '';
      
      const select = document.getElementById('forgetColSelect');
      select.innerHTML = '';

      collections.forEach(c => {
        const div = document.createElement('div');
        div.className = `collection-item glass ${activeCollection === c.name ? 'active' : ''}`;
        div.onclick = () => {
          activeCollection = activeCollection === c.name ? null : c.name;
          renderCollections();
          if (document.getElementById('searchInput').value) performSearch();
        };

        div.innerHTML = `
          <div class="collection-header">
            <span class="collection-name">${c.name}</span>
            <span class="badge">${c.doc_count}</span>
          </div>
          <div class="collection-meta">
            <span>${c.adapter}</span>
            <button class="btn-icon" onclick="event.stopPropagation(); reindex('${c.name}')" title="Re-index">
              ⟳
            </button>
          </div>
        `;
        list.appendChild(div);

        const opt = document.createElement('option');
        opt.value = c.name;
        opt.innerText = c.name;
        select.appendChild(opt);
      });
    }

    async function reindex(name) {
      if(!confirm(`Re-index collection '${name}'? This may take a while.`)) return;
      const res = await fetch(`/api/collections/${name}/index`, { method: 'POST' });
      if (res.ok) {
        alert('Indexing complete!');
        fetchCollections();
      } else {
        alert('Indexing failed.');
      }
    }

    function handleSearch(e) {
      if (e.key === 'Enter') performSearch();
    }

    async function performSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const resDiv = document.getElementById('results');
      if (!q) {
        resDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">Please enter a search query.</div>';
        return;
      }

      resDiv.innerHTML = '<div style="text-align:center; margin-top:40px;"><div class="loader"></div></div>';
      
      let url = `/api/search?q=${encodeURIComponent(q)}&k=20`;
      if (activeCollection) url += `&collection=${encodeURIComponent(activeCollection)}`;

      const res = await fetch(url);
      const hits = await res.json();

      if (hits.length === 0) {
        resDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">No results found.</div>';
        return;
      }

      resDiv.innerHTML = '';
      hits.forEach((h, i) => {
        const card = document.createElement('div');
        card.className = 'result-card glass';
        card.style.animationDelay = `${i * 0.05}s`;
        
        // Highlight query in snippet
        const regex = new RegExp(`(${q})`, 'gi');
        const highlightedSnippet = h.snippet.replace(regex, '<span class="highlight">$1</span>');

        card.innerHTML = `
          <div class="result-header">
            <div class="result-title">${h.title || 'Untitled Document'}</div>
            <div class="score-badge">${h.score.toFixed(3)}</div>
          </div>
          <div class="result-snippet">${highlightedSnippet}</div>
          <div class="result-meta">
            <span>🏷️ ${h.collection}</span>
            <span>📄 ${h.source_ref}</span>
          </div>
        `;
        resDiv.appendChild(card);
      });
    }

    // Modal Logic
    function openNewCollectionModal() { document.getElementById('newColModal').classList.add('active'); }
    function openForgetModal() { document.getElementById('forgetModal').classList.add('active'); }
    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    async function createCollection() {
      const name = document.getElementById('newColName').value;
      const root = document.getElementById('newColRoot').value;
      const adapter = document.getElementById('newColAdapter').value;
      if (!name || !root) return alert('Name and root are required.');

      const res = await fetch('/api/collections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, root, adapter })
      });
      
      if (res.ok) {
        closeModals();
        fetchCollections();
        document.getElementById('newColName').value = '';
        document.getElementById('newColRoot').value = '';
      } else {
        const err = await res.json();
        alert('Error: ' + err.detail);
      }
    }

    async function forgetDocuments() {
      const collection = document.getElementById('forgetColSelect').value;
      const query = document.getElementById('forgetQuery').value;
      if (!query) return alert('Query is required.');

      if(!confirm(`WARNING: This will permanently delete documents in '${collection}' matching '${query}'. Continue?`)) return;

      const res = await fetch('/api/forget', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection, query })
      });

      if (res.ok) {
        const data = await res.json();
        alert(`Removed ${data.removed} document(s).`);
        closeModals();
        fetchCollections();
        if (document.getElementById('searchInput').value) performSearch();
      } else {
        alert('Error forgetting documents.');
      }
    }

    // Init
    fetchCollections();
  </script>
</body>
</html>
